<!DOCTYPE html><!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUET Agriculture - Premium Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ======================================================= -->
    <!-- FIREBASE REALTIME DATABASE SETUP -->
    <!-- ======================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSzOjAtbkqU9vDYilVEn19PXH0twCtSaQ",
            authDomain: "ved-agro-bright.firebaseapp.com",
            projectId: "ved-agro-bright",
            storageBucket: "ved-agro-bright.firebasestorage.app",
            messagingSenderId: "755278018836",
            appId: "1:755278018836:web:1de993df0e3af3d06aaa01",
            measurementId: "G-WNQNZW4MQQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // CUET Exam ke liye data fetch karne ka path
        const cuetRef = ref(db, 'notes/cuet_exam');
        
        onValue(cuetRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('dynamic-cuet-wrapper');
            const skeleton = document.getElementById('loading-skeleton');
            
            container.innerHTML = ""; 
            skeleton.style.display = "none"; 

            if (data) {
                Object.keys(data).forEach((key) => {
                    const item = data[key];
                    const cardHTML = `
                        <div class="pro-card">
                            <div class="card-tag">CUET ICAR</div>
                            <div class="card-main">
                                <div class="file-icon-box">
                                    <i class="fas fa-graduation-cap"></i>
                                </div>
                                <div class="card-details">
                                    <h3>${item.title}</h3>
                                    <p>${item.description || 'Central University Entrance Exam Syllabus Notes.'}</p>
                                    <div class="meta-info">
                                        <span><i class="fas fa-layer-group"></i> NCERT Based</span>
                                        <span><i class="fas fa-check-circle"></i> Live</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-action">
                                <a href="${item.link}" target="_blank" class="action-btn">
                                    <span>View PDF</span> <i class="fas fa-external-link-alt"></i>
                                </a>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('afterbegin', cardHTML);
                });
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-university"></i></div>
                        <h3>No CUET Notes Yet</h3>
                        <p>Admin panel se CUET Agriculture ke notes upload karte hi wo turant yahan live dikhenge.</p>
                    </div>
                `;
            }
        });
    </script>
    <!-- ======================================================= -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f4f7f5; color: #2c3e50; padding-bottom: 30px; }

        /* Professional Header Custom App Bar */
        header {
            background: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            border-bottom: 1px solid #eef2f0;
        }
        .back-circle { width: 38px; height: 38px; background: #f0f4f1; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2d5a27; text-decoration: none; font-size: 0.95rem; transition: 0.2s; }
        .back-circle:active { background: #e1eae3; transform: scale(0.95); }
        header h1 { font-size: 1.1rem; font-weight: 600; color: #1e3d1a; }
        .header-badge { background: #e1f5fe; color: #0288d1; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }

        /* Premium Minimalist Hero Section */
        .premium-banner {
            background: linear-gradient(135deg, #1e3d1a 0%, #16a085 100%);
            color: white;
            padding: 35px 20px;
            margin: 15px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(22, 160, 133, 0.15);
        }
        .banner-content h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; color: #fff; }
        .banner-content p { font-size: 0.85rem; color: #e8f8f5; font-weight: 300; line-height: 1.4; }
        
        /* Stats Chips bar */
        .stat-bar { display: flex; gap: 10px; margin-top: 15px; }
        .stat-chip { background: rgba(255, 255, 255, 0.12); padding: 5px 12px; border-radius: 30px; font-size: 0.75rem; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(5px); }
        .stat-chip i { color: #ffcc00; }

        /* Wrapper Container */
        .main-wrapper { padding: 10px 15px; }
        .section-headline { font-size: 0.88rem; font-weight: 600; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 15px; padding-left: 2px; }

        /* Professional Dynamic Cards Style */
        .notes-grid-stack { display: flex; flex-direction: column; gap: 16px; }
        
        .pro-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            border: 1px solid #eef2f0;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }
        .pro-card:active { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.05); }
        
        /* Premium Tag */
        .card-tag { position: absolute; top: 0; right: 0; background: #e8f5e9; color: #2d5a27; font-size: 0.65rem; font-weight: 700; padding: 4px 12px; border-bottom-left-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .card-main { display: flex; gap: 15px; align-items: flex-start; }
        
        .file-icon-box { 
            width: 48px; height: 48px; background: #e8f8f5; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #16a085; flex-shrink: 0; border: 1px solid #a3e4d7;
        }
        
        .card-details { flex: 1; }
        .card-details h3 { font-size: 1rem; font-weight: 600; color: #2c3e50; line-height: 1.3; margin-bottom: 4px; padding-right: 45px; }
        .card-details p { font-size: 0.8rem; color: #7f8c8d; line-height: 1.4; margin-bottom: 10px; font-weight: 300; }
        
        .meta-info { display: flex; gap: 12px; font-size: 0.72rem; color: #95a5a6; }
        .meta-info span { display: flex; align-items: center; gap: 4px; }

        /* Action Panel Inside Card */
        .card-action { margin-top: 15px; padding-top: 12px; border-top: 1px solid #f8fbf9; display: flex; justify-content: flex-end; }
        .action-btn { background: #16a085; color: white; text-decoration: none; padding: 8px 18px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .action-btn:active { background: #117a65; }

        /* Skeleton Loading UI */
        .skeleton-card { background: white; padding: 20px; border-radius: 18px; border: 1px solid #eef2f0; display: flex; flex-direction: column; gap: 15px; }
        .skeleton-row { display: flex; gap: 15px; }
        .skeleton-square { width: 48px; height: 48px; background: #eaeaea; border-radius: 14px; animation: pulse 1.5s infinite ease-in-out; }
        .skeleton-text-container { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .skeleton-line { height: 12px; background: #eaeaea; border-radius: 4px; animation: pulse 1.5s infinite ease-in-out; }
        .skeleton-line.short { width: 60%; }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Empty State Graphic */
        .empty-state { text-align: center; padding: 60px 20px; color: #95a5a6; }
        .empty-icon { width: 70px; height: 70px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2rem; color: #bdc3c7; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .empty-state h3 { font-size: 1.1rem; color: #2c3e50; font-weight: 600; margin-bottom: 5px; }
        .empty-state p { font-size: 0.8rem; max-width: 250px; margin: 0 auto; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- Professional Navbar -->
    <header>
        <a href="index.html" class="back-circle"><i class="fas fa-chevron-left"></i></a>
        <h1>CUET Agriculture</h1>
        <div class="header-badge">ICAR 2026</div>
    </header>

    <!-- App Premium Banner Section -->
    <div class="premium-banner">
        <div class="banner-content">
            <h2>CUET (UG) Exam Portal</h2>
            <p>Central Universities aur ICAR institutes ke liye standard level study materials aur targeted syllabus PDFs.</p>
        </div>
        <div class="stat-bar">
            <div class="stat-chip"><i class="fas fa-graduation-cap"></i> Central Universities</div>
            <div class="stat-chip"><i class="fas fa-sync-alt"></i> Auto Refresh</div>
        </div>
    </div>

    <!-- Main Stack Framework -->
    <div class="main-wrapper">
        <h3 class="section-headline">Study Material & PDFs</h3>

        <!-- Skeleton Loader UI -->
        <div id="loading-skeleton" class="notes-grid-stack">
            <div class="skeleton-card">
                <div class="skeleton-row">
                    <div class="skeleton-square"></div>
                    <div class="skeleton-text-container">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Realtime Firebase Data Output -->
        <div class="notes-grid-stack" id="dynamic-cuet-wrapper">
            <!-- Firebase injection point -->
        </div>
    </div>

</body>
</html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Hello, World!</title>
</head>
<body>
  <h1>
    Hello, World!
  </h1>
</body>
</html>
