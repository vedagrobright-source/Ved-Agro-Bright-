<!DOCTYPE html>
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkari Job Alerts - Ved Agro Bright</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ======================================================= -->
    <!-- FIREBASE REALTIME DATABASE SETUP -->
    <!-- ======================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSzOjAtbkqU9vDYilVEn19PXH0twCtSaQ",
            authDomain: "ved-agro-bright.firebaseapp.com",
            projectId: "ved-agro-bright",
            storageBucket: "ved-agro-bright.firebasestorage.app",
            messagingSenderId: "755278018836",
            appId: "1:755278018836:web:1de993df0e3af3d06aaa01",
            measurementId: "G-WNQNZW4MQQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Job Alerts fetch karne ka path
        const jobRef = ref(db, 'job_alerts');
        
        onValue(jobRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('dynamic-jobs-wrapper');
            const skeleton = document.getElementById('loading-skeleton');
            
            container.innerHTML = ""; 
            skeleton.style.display = "none"; 

            if (data) {
                Object.keys(data).forEach((key) => {
                    const item = data[key];
                    const cardHTML = `
                        <div class="job-card">
                            <div class="job-status-badge">Active</div>
                            <div class="job-main">
                                <div class="job-icon-box">
                                    <i class="fas fa-briefcase"></i>
                                </div>
                                <div class="job-details">
                                    <span class="dept-tag">${item.department || 'Govt. of Rajasthan'}</span>
                                    <h3>${item.title}</h3>
                                    <p>${item.description || 'Nayi bharti ka vishleshna aur details.'}</p>
                                    
                                    <div class="job-meta">
                                        <div class="meta-item text-danger">
                                            <i class="far fa-calendar-times"></i> Last Date: <b>${item.lastDate || 'N/A'}</b>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="job-action">
                                <a href="${item.link}" target="_blank" class="apply-btn">
                                    <span>Apply / Notification</span> <i class="fas fa-external-link-alt"></i>
                                </a>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('afterbegin', cardHTML); // Naya notification sabse upar dikhega
                });
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-bell-slash"></i></div>
                        <h3>No New Job Alerts</h3>
                        <p>Abhi koi active vacancy nahi hai. Admin panel se add karte hi wo turant yahan live show ho jayegi.</p>
                    </div>
                `;
            }
        });
    </script>
    <!-- ======================================================= -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f4f7f5; color: #2c3e50; padding-bottom: 40px; }

        /* Professional Header Custom App Bar */
        header {
            background: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            border-bottom: 1px solid #eef2f0;
        }
        .back-circle { width: 38px; height: 38px; background: #f0f4f1; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2d5a27; text-decoration: none; font-size: 0.95rem; }
        header h1 { font-size: 1.1rem; font-weight: 600; color: #1e3d1a; }
        .header-badge { background: #e8f5e9; color: #2d5a27; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }

        /* Premium Minimalist Hero Section */
        .premium-banner {
            background: linear-gradient(135deg, #d35400 0%, #2d5a27 100%);
            color: white;
            padding: 35px 20px;
            margin: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(211, 84, 0, 0.15);
        }
        .banner-content h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
        .banner-content p { font-size: 0.85rem; color: #f9ebea; font-weight: 300; line-height: 1.4; }

        /* Wrapper Container */
        .main-wrapper { padding: 10px 15px; }
        .section-headline { font-size: 0.88rem; font-weight: 600; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 15px; padding-left: 2px; }

        /* Job Alert Cards Stack */
        .jobs-grid-stack { display: flex; flex-direction: column; gap: 18px; }
        
        .job-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            border: 1px solid #eef2f0;
            position: relative;
            overflow: hidden;
        }
        
        /* Active Job Tag */
        .job-status-badge { position: absolute; top: 0; right: 0; background: #27ae60; color: white; font-size: 0.65rem; font-weight: 700; padding: 4px 12px; border-bottom-left-radius: 12px; text-transform: uppercase; }
        
        .job-main { display: flex; gap: 15px; align-items: flex-start; }
        
        .job-icon-box { 
            width: 48px; height: 48px; background: #fff3e0; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #e67e22; flex-shrink: 0; border: 1px solid #ffe0b2;
        }
        
        .job-details { flex: 1; }
        .dept-tag { font-size: 0.7rem; font-weight: 600; color: #e67e22; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
        .job-details h3 { font-size: 1rem; font-weight: 600; color: #2c3e50; line-height: 1.3; margin-bottom: 4px; padding-right: 45px; }
        .job-details p { font-size: 0.8rem; color: #7f8c8d; line-height: 1.4; margin-bottom: 12px; font-weight: 300; }
        
        .job-meta { display: flex; gap: 12px; font-size: 0.78rem; }
        .meta-item { display: flex; align-items: center; gap: 5px; }
        .text-danger { color: #c62828; }

        /* Action Footer Panel Inside Card */
        .job-action { margin-top: 15px; padding-top: 12px; border-top: 1px solid #fdfefe; display: flex; justify-content: flex-end; }
        .apply-btn { background: #2d5a27; color: white; text-decoration: none; padding: 8px 18px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .apply-btn:active { background: #1e3d1a; }

        /* Skeleton Loading UI */
        .skeleton-card { background: white; padding: 20px; border-radius: 18px; border: 1px solid #eef2f0; display: flex; flex-direction: column; gap: 15px; }
        .skeleton-row { display: flex; gap: 15px; }
        .skeleton-square { width: 48px; height: 48px; background: #eaeaea; border-radius: 14px; animation: pulse 1.5s infinite ease-in-out; }
        .skeleton-text-container { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .skeleton-line { height: 12px; background: #eaeaea; border-radius: 4px; animation: pulse 1.5s infinite ease-in-out; }
        .skeleton-line.short { width: 50%; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; color: #95a5a6; }
        .empty-icon { width: 70px; height: 70px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2rem; color: #bdc3c7; }
        .empty-state h3 { font-size: 1.1rem; color: #2c3e50; font-weight: 600; margin-bottom: 5px; }
        .empty-state p { font-size: 0.8rem; max-width: 250px; margin: 0 auto; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- Top App Bar -->
    <header>
        <a href="index.html" class="back-circle"><i class="fas fa-chevron-left"></i></a>
        <h1>Job Alerts & Vacancies</h1>
        <div class="header-badge">Updates</div>
    </header>

    <!-- App Premium Banner Section -->
    <div class="premium-banner">
        <div class="banner-content">
            <h2>सरकारी नौकरी अलर्ट्स</h2>
            <p>Agriculture Sector aur Rajasthan Govt ki sabhi nayi bharti ki sabse tej aur sateek jankari.</p>
        </div>
    </div>

    <!-- Main Stack Framework -->
    <div class="main-wrapper">
        <h3 class="section-headline">Latest Notifications</h3>

        <!-- Skeleton Loader UI -->
        <div id="loading-skeleton" class="jobs-grid-stack">
            <div class="skeleton-card">
                <div class="skeleton-row">
                    <div class="skeleton-square"></div>
                    <div class="skeleton-text-container">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Realtime Firebase Job Output -->
        <div class="jobs-grid-stack" id="dynamic-jobs-wrapper">
            <!-- Firebase points auto injection here -->
        </div>
    </div>

</body>
</html>

  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
