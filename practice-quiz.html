<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quiz - Ved Agro Bright</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f4f7f5; padding: 20px; }
        
        .quiz-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .question { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; color: #1e3d1a; }
        
        .option-btn {
            width: 100%; padding: 15px; margin-bottom: 10px; border: 1px solid #eef2f0;
            border-radius: 12px; background: #fff; cursor: pointer; text-align: left;
            font-size: 0.95rem; transition: 0.3s;
        }
        .option-btn:hover { background: #f0f4f1; }
    </style>
</head>
<body>

    <div class="quiz-card" id="quiz-container">
        <!-- Data Firebase se yahan load hoga -->
        <div id="quiz-content">Loading Question...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSzOjAtbkqU9vDYilVEn19PXH0twCtSaQ",
            authDomain: "ved-agro-bright.firebaseapp.com",
            projectId: "ved-agro-bright",
            databaseURL: "https://ved-agro-bright-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fetch Quiz Data
        onValue(ref(db, 'quizzes/daily_quiz'), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('quiz-content');
            container.innerHTML = "";

            for (let key in data) {
                const q = data[key];
                container.innerHTML += `
                    <div class="question">${q.question}</div>
                    <button class="option-btn" onclick="checkAnswer('A', '${q.correct}', this)">A: ${q.optionA}</button>
                    <button class="option-btn" onclick="checkAnswer('B', '${q.correct}', this)">B: ${q.optionB}</button>
                    <button class="option-btn" onclick="checkAnswer('C', '${q.correct}', this)">C: ${q.optionC}</button>
                    <button class="option-btn" onclick="checkAnswer('D', '${q.correct}', this)">D: ${q.optionD}</button>
                `;
            }
        });

        // Global function to check answer
        window.checkAnswer = function(selected, correct, element) {
            const parent = element.parentElement;
            const buttons = parent.querySelectorAll('.option-btn');
            
            // Disable all buttons
            buttons.forEach(btn => btn.disabled = true);

            // Correct match logic (Dada, yahan 'correct' variable directly 'A', 'B', 'C' ya 'D' le raha hai)
            if (selected === correct) {
                element.style.background = "#28a745";
                element.style.color = "white";
                alert("Sahi Jawaab! 🎉");
            } else {
                element.style.background = "#dc3545";
                element.style.color = "white";
                alert("Galat Jawaab! Sahi Option: " + correct);
            }
        };
    </script>
</body>
</html>
