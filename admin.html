<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Panel - Ved Agro Bright</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ======================================================= -->
    <!-- FIREBASE MODULE INTEGRATION WITH LIVE DELETE ENGINE -->
    <!-- ======================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSzOjAtbkqU9vDYilVEn19PXH0twCtSaQ",
            authDomain: "ved-agro-bright.firebaseapp.com",
            projectId: "ved-agro-bright",
            storageBucket: "ved-agro-bright.firebasestorage.app",
            messagingSenderId: "755278018836",
            appId: "1:755278018836:web:1de993df0e3af3d06aaa01",
            measurementId: "G-WNQNZW4MQQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Data Upload Logic
        window.uploadData = function(type) {
            if (type === 'notes') {
                const category = document.getElementById('note-category').value;
                const title = document.getElementById('note-title').value.trim();
                const desc = document.getElementById('note-desc').value.trim();
                const link = document.getElementById('note-link').value.trim();

                if(!title || !link) { alert('Title aur Link daalna zaroori hai!'); return; }

                const targetRef = ref(db, `notes/${category}`);
                const newNoteRef = push(targetRef);
                set(newNoteRef, { title: title, description: desc, link: link })
                .then(() => { showStatus('Notes successfully publish ho gaye hain!'); resetForm('notes-form'); })
                .catch(() => { showStatus('Error aayi, fir koshish karein.', true); });

            } else if (type === 'quiz') {
                const question = document.getElementById('q-text').value.trim();
                const optA = document.getElementById('q-a').value.trim();
                const optB = document.getElementById('q-b').value.trim();
                const optC = document.getElementById('q-c').value.trim();
                const optD = document.getElementById('q-d').value.trim();
                const correct = document.getElementById('q-correct').value;

                if(!question || !optA || !optB || !optC || !optD) { alert('Sawaal aur charo options bharna zaroori hai!'); return; }

                const targetRef = ref(db, 'quizzes/daily_quiz');
                const newQuizRef = push(targetRef);
                set(newQuizRef, { question: question, optionA: optA, optionB: optB, optionC: optC, optionD: optD, correct: correct })
                .then(() => { showStatus('Quiz question live ho gaya hai!'); resetForm('quiz-form'); })
                .catch(() => { showStatus('Error! Data save nahi hua.', true); });

            } else if (type === 'job') {
                const title = document.getElementById('job-title').value.trim();
                const dept = document.getElementById('job-dept').value.trim();
                const desc = document.getElementById('job-desc').value.trim();
                const lastDate = document.getElementById('job-date').value.trim();
                const link = document.getElementById('job-link').value.trim();

                if(!title || !link) { alert('Job Title aur Apply Link zaroori hai!'); return; }

                const targetRef = ref(db, 'job_alerts');
                const newJobRef = push(targetRef);
                set(newJobRef, { title: title, department: dept, description: desc, lastDate: lastDate, link: link })
                .then(() => { showStatus('Job Alert notification publish ho gaya!'); resetForm('job-form'); })
                .catch(() => { showStatus('Error! Job update nahi hui.', true); });
            }
        }

        // Live Data Sync for Management Tab
        window.loadManageData = function() {
            const listContainer = document.getElementById('live-data-list');
            listContainer.innerHTML = "<p style='text-align:center;color:#7f8c8d;font-size:0.85rem;'>Database se items load ho rahe hain...</p>";

            // Fetch Notes
            const categories = ['agriculture_supervisor', 'jet_exam', 'cuet_exam'];
            let htmlContent = "";

            categories.forEach(cat => {
                const noteRef = ref(db, `notes/${cat}`);
                onValue(noteRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        let catName = cat.replace(/_/g, ' ').toUpperCase();
                        htmlContent += `<div class="manage-cat-header">${catName} (NOTES)</div>`;
                        for (let key in data) {
                            htmlContent += `
                                <div class="manage-item-card">
                                    <div class="item-details">
                                        <h4>${data[key].title}</h4>
                                        <p>${data[key].description || 'No description'}</p>
                                    </div>
                                    <button class="delete-btn" onclick="deleteFirebaseItem('notes/${cat}/${key}')">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>`;
                        }
                        listContainer.innerHTML = htmlContent || "<p style='text-align:center;color:#7f8c8d;padding:20px;'>Abhi database me koi data nahi hai.</p>";
                    }
                });
            });

            // Fetch Quizzes
            onValue(ref(db, 'quizzes/daily_quiz'), (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    htmlContent += `<div class="manage-cat-header" style="background:#e8f0fe; color:#1a73e8;">DAILY PRACTICE QUIZZES</div>`;
                    for (let key in data) {
                        htmlContent += `
                            <div class="manage-item-card">
                                <div class="item-details">
                                    <h4><b>Q:</b> ${data[key].question}</h4>
                                    <p>Ans: Option ${data[key].correct}</p>
                                </div>
                                <button class="delete-btn" onclick="deleteFirebaseItem('quizzes/daily_quiz/${key}')">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>`;
                    }
                    listContainer.innerHTML = htmlContent;
                }
            });

            // Fetch Job Alerts
            onValue(ref(db, 'job_alerts'), (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    htmlContent += `<div class="manage-cat-header" style="background:#fde8e8; color:#c62828;">GOVT. JOB ALERTS</div>`;
                    for (let key in data) {
                        htmlContent += `
                            <div class="manage-item-card">
                                <div class="item-details">
                                    <h4>${data[key].title}</h4>
                                    <p>Last Date: ${data[key].lastDate || 'N/A'}</p>
                                </div>
                                <button class="delete-btn" onclick="deleteFirebaseItem('job_alerts/${key}')">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>`;
                    }
                    listContainer.innerHTML = htmlContent;
                }
            });
        }

        // Live Delete Execution Function
        window.deleteFirebaseItem = function(path) {
            if (confirm("⚠️ Kya aap sach me is item ko hamesha ke liye delete karna chahte hain?")) {
                const itemRef = ref(db, path);
                remove(itemRef)
                .then(() => { 
                    showStatus("Item successfully delete kar diya gaya!");
                    loadManageData(); // Reload panel list
                })
                .catch(() => { alert("Error! Delete nahi ho paya."); });
            }
        }

        function showStatus(msg, isError = false) {
            const statusDiv = document.getElementById('status-msg');
            statusDiv.innerText = msg;
            statusDiv.style.display = "block";
            statusDiv.className = isError ? "status-box error" : "status-box success";
            setTimeout(() => { statusDiv.style.display = "none"; }, 4000);
        }

        function resetForm(id) { document.getElementById(id).reset(); }
    </script>
    <!-- ======================================================= -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f4f7f5; color: #2c3e50; min-height: 100vh; }

        /* Security Lock Screen */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e3d1a; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }
        .lock-box { background: white; padding: 30px 25px; border-radius: 24px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 340px; }
        .lock-box i { font-size: 2.5rem; color: #2d5a27; margin-bottom: 15px; }
        .lock-box h2 { font-size: 1.3rem; margin-bottom: 8px; color: #2c3e50; font-weight: 600; }
        .lock-box p { font-size: 0.8rem; color: #7f8c8d; margin-bottom: 20px; }
        .pin-input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1.3rem; text-align: center; letter-spacing: 10px; font-weight: bold; margin-bottom: 15px; outline: none; }
        .pin-input:focus { border-color: #2d5a27; }
        .unlock-btn { background: #2d5a27; color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }

        /* Main Dashboard Layout */
        #admin-dashboard { display: none; padding-bottom: 40px; }
        
        header { background: #ffffff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.04); border-bottom: 1px solid #eef2f0; }
        header h1 { font-size: 1.1rem; font-weight: 600; color: #1e3d1a; display: flex; align-items: center; gap: 8px; }
        .logout-btn { background: #fff5f5; color: #c62828; border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

        /* Tabs Navigation Bar */
        .tabs-container { display: flex; background: white; margin: 15px; padding: 5px; border-radius: 14px; border: 1px solid #eef2f0; gap: 5px; overflow-x: auto; }
        .tab-btn { flex: 1; border: none; padding: 10px 2px; background: transparent; color: #7f8c8d; font-size: 0.75rem; font-weight: 500; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 75px; }
        .tab-btn.active { background: #2d5a27; color: white; font-weight: 600; }
        .tab-btn i { font-size: 1rem; }

        /* Panels Container */
        .panel-wrapper { padding: 0 15px; }
        .form-panel { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eef2f0; box-shadow: 0 4px 15px rgba(0,0,0,0.01); display: none; }
        .form-panel.active { display: block; }
        .panel-title { font-size: 1.05rem; font-weight: 600; color: #2c3e50; margin-bottom: 18px; border-bottom: 2px solid #f4f7f5; padding-bottom: 8px; }

        /* Form Controls */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.9rem; color: #334155; outline: none; background: #f8fafc; }
        .form-control:focus { border-color: #2d5a27; background: #ffffff; }
        textarea.form-control { resize: none; min-height: 80px; }

        .submit-btn { width: 100%; background: #2d5a27; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }

        /* Global Status Alerts Banner */
        .status-box { margin: 15px; padding: 12px 15px; border-radius: 12px; font-size: 0.85rem; font-weight: 500; text-align: center; display: none; }
        .status-box.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .status-box.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

        /* ======================================================= -->
        /* SYSTEM LIVE DATABASE MANAGER SYSTEM CARD CSS */
        /* ======================================================= --> */
        .manage-cat-header { background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; margin: 15px 0 8px 0; letter-spacing: 0.5px; }
        .manage-item-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 8px; }
        .item-details { flex: 1; }
        .item-details h4 { font-size: 0.88rem; color: #1e293b; font-weight: 600; margin-bottom: 2px; }
        .item-details p { font-size: 0.75rem; color: #64748b; line-height: 1.3; }
        .delete-btn { background: #fff5f5; color: #ef4444; border: 1px solid #fee2e2; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        .delete-btn:active { background: #fee2e2; transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- PIN PROTECTION WALL -->
    <div id="lock-screen">
        <div class="lock-box">
            <i class="fas fa-user-shield"></i>
            <h2>Admin Security Lock</h2>
            <p>Portal access karne ke liye 4-digit PIN dalein</p>
            <input type="password" id="security-pin" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric">
            <button class="unlock-btn" onclick="verifySystemPIN()">Verify & Unlock</button>
        </div>
    </div>

    <!-- MAIN LIVE COMMAND CENTER -->
    <div id="admin-dashboard">
        
        <header>
            <h1><i class="fas fa-sliders-h"></i> Control Dashboard</h1>
            <button class="logout-btn" onclick="lockSystem()">Lock Panel</button>
        </header>

        <!-- Navigation Tabs Selector Bar -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchControlTab(this, 'notes-panel')">
                <i class="fas fa-book"></i> Notes Push
            </button>
            <button class="tab-btn" onclick="switchControlTab(this, 'quiz-panel')">
                <i class="fas fa-pen-alt"></i> Quiz Add
            </button>
            <button class="tab-btn" onclick="switchControlTab(this, 'job-panel')">
                <i class="fas fa-bullhorn"></i> Job Alerts
            </button>
            <button class="tab-btn" onclick="switchControlTab(this, 'manage-panel'); loadManageData();" style="background: #fff8e1; color: #b78103;">
                <i class="fas fa-tasks"></i> Manage Live
            </button>
        </div>

        <div id="status-msg" class="status-box"></div>

        <div class="panel-wrapper">

            <!-- SHEET 1: STUDY NOTES CONTROLLER -->
            <div id="notes-panel" class="form-panel active">
                <h2 class="panel-title">Upload Study Materials & PDFs</h2>
                <form id="notes-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label>Select Target Page (Category)</label>
                        <select id="note-category" class="form-control">
                            <option value="agriculture_supervisor">Agriculture Supervisor</option>
                            <option value="jet_exam">JET Exam Portal</option>
                            <option value="cuet_exam">CUET Agriculture Portal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Topic / Title</label>
                        <input type="text" id="note-title" class="form-control" placeholder="e.g., सस्य विज्ञान Part 1">
                    </div>
                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <textarea id="note-desc" class="form-control" placeholder="Short description..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>PDF Link / Google Drive URL</label>
                        <input type="url" id="note-link" class="form-control" placeholder="https://drive.google.com/file/...">
                    </div>
                    <button type="button" class="submit-btn" onclick="uploadData('notes')">
                        <i class="fas fa-cloud-upload-alt"></i> Publish Material
                    </button>
                </form>
            </div>

            <!-- SHEET 2: INTERACTIVE QUIZ CONTROLLER -->
            <div id="quiz-panel" class="form-panel">
                <h2 class="panel-title">Add Daily Practice Questions</h2>
                <form id="quiz-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label>Question Text (Sawaal)</label>
                        <textarea id="q-text" class="form-control" placeholder="Type question here..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Option A</label><input type="text" id="q-a" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Option B</label><input type="text" id="q-b" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Option C</label><input type="text" id="q-c" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Option D</label><input type="text" id="q-d" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Correct Answer Value</label>
                        <select id="q-correct" class="form-control">
                            <option value="A">Option A</option>
                            <option value="B">Option B</option>
                            <option value="C">Option C</option>
                            <option value="D">Option D</option>
                        </select>
                    </div>
                    <button type="button" class="submit-btn" onclick="uploadData('quiz')">
                        <i class="fas fa-plus-circle"></i> Go Live Question
                    </button>
                </form>
            </div>

            <!-- SHEET 3: JOB ALERTS CONTROLLER -->
            <div id="job-panel" class="form-panel">
                <h2 class="panel-title">Publish Govt. Job Alerts</h2>
                <form id="job-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label>Job Title / Vacancy Name</label>
                        <input type="text" id="job-title" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Department Name</label>
                        <input type="text" id="job-dept" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Short Details</label>
                        <textarea id="job-desc" class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Last Date To Apply</label>
                        <input type="text" id="job-date" class="form-control" placeholder="e.g., 15 June 2026">
                    </div>
                    <div class="form-group">
                        <label>Notification PDF / Apply Link</label>
                        <input type="url" id="job-link" class="form-control">
                    </div>
                    <button type="button" class="submit-btn" onclick="uploadData('job')">
                        <i class="fas fa-paper-plane"></i> Broadcast Job Alert
                    </button>
                </form>
            </div>

            <!-- ======================================================= -->
            <!-- SHEET 4: NEW LIVE DATABASE MANAGER PANEL -->
            <!-- ======================================================= -->
            <div id="manage-panel" class="form-panel">
                <h2 class="panel-title">Manage & Delete Live Content</h2>
                <div id="live-data-list">
                    <!-- Live database elements will append here dynamically -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // System Protection Lock Verification PIN = 2525
        function verifySystemPIN() {
            const pinEntered = document.getElementById('security-pin').value;
            if (pinEntered === "2525") {
                document.getElementById('lock-screen').style.display = "none";
                document.getElementById('admin-dashboard').style.display = "block";
            } else {
                alert('💥 Galat security PIN! Access Denied.');
                document.getElementById('security-pin').value = "";
            }
        }

        function lockSystem() {
            document.getElementById('security-pin').value = "";
            document.getElementById('lock-screen').style.display = "flex";
            document.getElementById('admin-dashboard').style.display = "none";
        }

        function switchControlTab(btnElement, targetPanelId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById(targetPanelId).classList.add('active');
        }
    </script>
</body>
</html>
